<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Кости тыща</title>

    <!-- Подключаем Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
    class="bg-radial from-slate-900 to-emerald-800 text-slate-100 h-dvh overflow-hidden flex flex-col justify-start p-4">

    <!-- 🛸 КОНТЕЙНЕР ДЛЯ УЛЬТРА-ПРОЗРАЧНЫХ ТОСТ-УВЕДОМЛЕНИЙ ПОВЕРХ ИГРОКОВ -->
    <div id="toast-container"
        class="fixed top-4 left-4 right-4 max-w-md mx-auto flex flex-col gap-2 pointer-events-none z-50"></div>

    <!-- 👥 ТВОЙ СТАРЫЙ СПИСОК ИГРОКОВ (С ЖЕЛЕЗНЫМИ БОЛТАМИ И РАЗМЫТИЕМ СНИЗУ) -->
    <div class="w-full relative flex-shrink-0"
        style="mask-image: linear-gradient(to bottom, black 80%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);">

        <!-- Окно прокрутки списка игроков -->
        <div id="scoreboard" class="w-full max-h-40 overflow-y-auto no-scrollbar pr-0.5 pb-4 flex flex-col gap-2">

            <!-- Карточка 1: Данил -->
            <div
                class="w-full bg-slate-900/60 backdrop-blur-md px-4 py-3 rounded-xl border border-slate-800/80 flex items-center justify-between gap-3 shadow-lg flex-shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse flex-shrink-0"></span>
                    <div class="flex flex-col min-w-0">
                        <span
                            class="font-extrabold text-base text-slate-100 truncate tracking-wide leading-tight">Данил</span>
                        <div class="flex gap-1 mt-1 text-sm select-none">
                            <span class="flex-shrink-0 animate-[bounce_0.3s_ease-in-out_1]">🔩</span>
                            <span class="flex-shrink-0 animate-[bounce_0.3s_ease-in-out_1]">🔩</span>
                            <span class="flex-shrink-0 opacity-20 filter grayscale">🔩</span>
                        </div>
                    </div>
                </div>
                <span
                    class="font-mono font-black text-base bg-slate-950/80 px-3 py-1 rounded-lg border border-slate-800 text-amber-400 shadow-inner flex-shrink-0">350</span>
            </div>

            <!-- Карточка 2: Олег -->
            <div
                class="w-full bg-slate-900/40 backdrop-blur-md px-4 py-3 rounded-xl border border-slate-800/40 flex items-center justify-between gap-3 opacity-70 flex-shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <span class="w-2.5 h-2.5 bg-slate-700 rounded-full flex-shrink-0"></span>
                    <div class="flex flex-col min-w-0">
                        <span
                            class="font-bold text-base text-slate-400 truncate tracking-wide leading-tight">Олег</span>
                        <div class="flex gap-1 mt-1 text-sm select-none opacity-20 filter grayscale">
                            <span class="flex-shrink-0">🔩</span><span class="flex-shrink-0">🔩</span><span
                                class="flex-shrink-0">🔩</span>
                        </div>
                    </div>
                </div>
                <span
                    class="font-mono font-black text-base bg-slate-950/40 px-3 py-1 rounded-lg border border-slate-800 text-slate-500 flex-shrink-0">120</span>
            </div>

            <!-- Карточка 3: Влад -->
            <div
                class="w-full bg-slate-900/40 backdrop-blur-md px-4 py-3 rounded-xl border border-slate-800/40 flex items-center justify-between gap-3 opacity-70 flex-shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <span class="w-2.5 h-2.5 bg-slate-700 rounded-full flex-shrink-0"></span>
                    <div class="flex flex-col min-w-0">
                        <span
                            class="font-bold text-base text-slate-400 truncate tracking-wide leading-tight">Влад</span>
                        <div class="flex gap-1 mt-1 text-sm select-none">
                            <span class="flex-shrink-0">🔩</span>
                            <span class="flex-shrink-0 opacity-20 filter grayscale">🔩</span>
                            <span class="flex-shrink-0 opacity-20 filter grayscale">🔩</span>
                        </div>
                    </div>
                </div>
                <span
                    class="font-mono font-black text-base bg-slate-950/40 px-3 py-1 rounded-lg border border-slate-800 text-slate-500 flex-shrink-0">450</span>
            </div>

            <!-- Карточка 4: Аня -->
            <div
                class="w-full bg-slate-900/40 backdrop-blur-md px-4 py-3 rounded-xl border border-slate-800/40 flex items-center justify-between gap-3 opacity-70 flex-shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <span class="w-2.5 h-2.5 bg-slate-700 rounded-full flex-shrink-0"></span>
                    <div class="flex flex-col min-w-0">
                        <span class="font-bold text-base text-slate-400 truncate tracking-wide leading-tight">Аня</span>
                        <div class="flex gap-1 mt-1 text-sm select-none">
                            <span class="flex-shrink-0">🔩</span><span class="flex-shrink-0">🔩</span>
                            <span class="flex-shrink-0 opacity-20 filter grayscale">🔩</span>
                        </div>
                    </div>
                </div>
                <span
                    class="font-mono font-black text-base bg-slate-950/40 px-3 py-1 rounded-lg border border-slate-800 text-slate-500 flex-shrink-0">0</span>
            </div>

        </div>
    </div>

    <!-- 🎲 ТРЕХМЕРНЫЙ ИГРОВОЙ СТОЛ (ИСПРАВЛЕННЫЙ) -->
    <!-- 🎲 ТРЕХМЕРНЫЙ ИГРОВОЙ СТОЛ (СВОБОДНЫЙ БРОСОК) -->
    <!-- 🎲 ТРЕХМЕРНЫЙ ИГРОВОЙ СТОЛ (УВЕЛИЧЕННАЯ ВЫСОТА АРЕНЫ) -->
    <main class="flex-grow flex items-center justify-center w-full max-w-sm mx-auto my-1 px-4 select-none">
        <!-- Изменили max-h-[220px] на max-h-[280px], чтобы кубикам было просторнее летать -->
        <div id="game-board"
            class="relative w-full aspect-square max-h-[280px] bg-slate-900/10 border border-dashed border-slate-800/40 rounded-3xl flex items-center justify-center shadow-inner"
            style="perspective: 1000px; -webkit-perspective: 1000px;">
            <!-- Сюда автономный скрипт game.js выстроит 3D-кубики -->
        </div>
    </main>




    <!-- ⚙️ НИЖНЯЯ ПАНЕЛЬ С КНОПКОЙ БРОСКА -->
    <footer class="w-full max-w-md mx-auto flex flex-col mt-auto mb-2 flex-shrink-0">
        <button id="roll-btn"
            class="w-full py-4.5 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-slate-950 font-black rounded-2xl text-base shadow-lg shadow-orange-500/20 active:scale-[0.97] transition-all duration-150 uppercase tracking-wider cursor-pointer select-none">
            Бросить кубики
        </button>
    </footer>

    <!-- Стили для скрытия полос прокрутки -->
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <!-- Подключаем автономный JS-движок -->
    <script src="static/js/physics.js"></script>
    <script src="static/js/game.js" defer></script>
</body>

</html>
